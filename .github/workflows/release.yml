name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test extension behavior
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
      - name: Validate version and package release
        run: python3 scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Publish release with downloadable extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vyro.zip dist/vyro-*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --title "VYRO $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
